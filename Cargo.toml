[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/config",
    "crates/market_data",
    "crates/wallet_tracker",
    "crates/strategy",
    "crates/risk",
    "crates/execution",
    "crates/simulator",
    "crates/portfolio",
    "crates/persistence",
    "crates/api",
    "crates/metrics",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
# --- internal ---
domain       = { path = "crates/domain" }
config       = { path = "crates/config" }
market_data  = { path = "crates/market_data" }
wallet_tracker = { path = "crates/wallet_tracker" }
strategy     = { path = "crates/strategy" }
risk         = { path = "crates/risk" }
execution    = { path = "crates/execution" }
simulator    = { path = "crates/simulator" }
portfolio    = { path = "crates/portfolio" }
persistence  = { path = "crates/persistence" }
api          = { path = "crates/api" }
metrics      = { path = "crates/metrics" }

# --- async ---
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "fs"] }
tokio-util = "0.7"
tokio-stream = "0.1"
futures-util = "0.3"
async-trait = "0.1"

# --- ser/de ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"

# --- net ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# --- data ---
rust_decimal = { version = "1.36", features = ["serde-with-str", "maths"] }
rust_decimal_macros = "1.36"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }

# --- persistence ---
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "rust_decimal", "macros", "migrate", "json"] }

# --- observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- errors ---
anyhow = "1"
thiserror = "2"

# --- misc ---
dotenvy = "0.15"
clap = { version = "4.5", features = ["derive", "env"] }
parking_lot = "0.12"
dashmap = "6"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
hex = "0.4"
once_cell = "1"
humantime-serde = "1"

# --- dev ---
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1

[profile.bench]
inherits = "release"
