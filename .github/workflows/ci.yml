name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two toolchains on purpose.
      #
      # `-D warnings` on a floating `stable` is a well-known CI trap: a new clippy release
      # adds lints and the build fails on code nobody touched. The lint gate is therefore
      # pinned to a known toolchain, so its verdict is reproducible and reviewable.
      # Build and test still run on floating stable, so genuine compiler regressions are
      # caught — they just cannot be caused by a new style lint.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy (pinned toolchain, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: dtolnay/rust-toolchain@stable

      - name: Clippy on latest stable (advisory only)
        run: cargo clippy --workspace --all-targets
        continue-on-error: true

      - name: Build
        run: cargo build --workspace

      # The suite is hermetic: no network, no database.
      - name: Test
        run: cargo test --workspace

      - name: Configuration validates
        run: cargo run -- --check

      - name: Live mode refuses without the second switch
        run: |
          if APP_MODE=live cargo run -- --check; then
            echo "::error::live mode started without LIVE_TRADING_ENABLED — the interlock is broken"
            exit 1
          fi
          echo "interlock holds"

  dashboard:
    name: Dashboard (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose config is valid
        run: docker compose config --quiet
      - name: Backend image builds
        run: docker build -t copytrader:ci .
