name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace

      # The suite is hermetic: no network, no database.
      - name: Test
        run: cargo test --workspace

      - name: Configuration validates
        run: cargo run -- --check

      - name: Live mode refuses without the second switch
        run: |
          if APP_MODE=live cargo run -- --check; then
            echo "::error::live mode started without LIVE_TRADING_ENABLED — the interlock is broken"
            exit 1
          fi
          echo "interlock holds"

  dashboard:
    name: Dashboard (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose config is valid
        run: docker compose config --quiet
      - name: Backend image builds
        run: docker build -t copytrader:ci .
